<svg width="680" height="740" viewBox="0 0 680 740" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AEGIS decision-making loop</title>
<desc>Flowchart: configure scenario, run baseline simulation, identify failures, generate alternative plan, run alternative simulation, compare outcomes, then adjust and repeat from the top.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-leader" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#9C9A92" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="740" fill="#FFFFFF"/>

<g font-family="Arial, Helvetica, sans-serif">

<!-- 1: Configure scenario (gray / setup) -->
<rect x="190" y="40" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Configure scenario</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Preset, road closures, capacities</text>

<line x1="340" y1="96" x2="340" y2="156" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 2: Run baseline simulation (purple / simulation) -->
<rect x="190" y="156" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Run baseline simulation</text>
<text x="340" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Routing, congestion, admission</text>

<line x1="340" y1="212" x2="340" y2="272" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 3: Identify failures (amber / problem found) -->
<rect x="190" y="272" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="340" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Identify failures</text>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Unserved agents, bottlenecks</text>

<line x1="340" y1="328" x2="340" y2="388" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 4: Generate alternative plan (purple / simulation) -->
<rect x="190" y="388" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="406" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Generate alternative plan</text>
<text x="340" y="424" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Load-balanced reassignment</text>

<line x1="340" y1="444" x2="340" y2="504" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 5: Run alternative simulation (purple / simulation) -->
<rect x="190" y="504" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="522" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Run alternative simulation</text>
<text x="340" y="540" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Same engine, same seed</text>

<line x1="340" y1="560" x2="340" y2="620" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 6: Compare outcomes (teal / result) -->
<rect x="190" y="620" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="638" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Compare outcomes</text>
<text x="340" y="656" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Metrics and honest trade-offs</text>

<!-- Feedback loop back to step 1 -->
<path d="M490,648 L560,648 L560,68 L490,68" fill="none" stroke="#9C9A92" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-leader)"/>
<text x="572" y="400" dominant-baseline="central" font-size="12" fill="#5F5E5A">&#8635; adjust &amp; repeat</text>

<!-- Legend -->
<rect x="150" y="700" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="168" y="706" dominant-baseline="central" font-size="12" fill="#5F5E5A">Setup</text>
<rect x="227" y="700" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="245" y="706" dominant-baseline="central" font-size="12" fill="#5F5E5A">Simulation</text>
<rect x="339" y="700" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="357" y="706" dominant-baseline="central" font-size="12" fill="#5F5E5A">Problem found</text>
<rect x="472" y="700" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="490" y="706" dominant-baseline="central" font-size="12" fill="#5F5E5A">Result</text>

</g>
</svg>
